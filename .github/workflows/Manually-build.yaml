name: Manually-build

on:
  workflow_dispatch:  # 手动触发

jobs:
  build_pull_request:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          #- ubuntu-22.04
          - macos-26
          # - windows-2025
        abi:
          #- armeabi-v7a
          - arm64-v8a
          #- x86
          #- x86_64
    env:
      BUILD_ABI: ${{ matrix.abi }}
    steps:
      - name: Fetch source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install extra-cmake-modules

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: |
          ./gradlew :app:assembleRelease

      - name: Move app and plugins to one dir
        shell: bash
        run: |
          mkdir app-and-plugins
          mv app/build/outputs/apk/release/* app-and-plugins/

      - name: Sign app and plugins
        uses: kevin-david/zipalign-sign-android-release@v2
        #uses: rpavlik/sign-android-release@master
        id: sign_apk
        with:
          releaseDirectory: app-and-plugins
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Upload app and plugins
        uses: actions/upload-artifact@v4
        with:
          name: app&plugins-${{ matrix.os }}-${{ matrix.abi }}
          path: app-and-plugins/*-signed.apk
